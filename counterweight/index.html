<style>
/* Woodblock print: indigo sky, persimmon sun, a keylined balance on paper. Night mode swaps the sun for a moon. */
:root {
  --paper: #eee0c0; --paper2: #e5d3ab; --pale: #f6ecd3; --line: #1b2a4e; --text: #2b2622; --head: #1b2a4e;
  --sky1: #2a4478; --sky2: #4d6a9c; --sun: #d85a26; --sun-d: #b2441a; --hill: #2a4478; --sea: #1b2a4e; --wave: #4d6a9c;
  --accent: #d85a26; --accent-d: #b2441a; --on-accent: #fbf3df; --muted: #6a6474; --hdr: #f6ecd3; --bowl: #2a4478;
  --serif: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", Georgia, serif;
  --sans: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Segoe UI", system-ui, sans-serif;
  --stars: none;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #141b30; --paper2: #1c2541; --pale: #212b4a; --line: #e6d8b4; --text: #e6dcc4; --head: #f0e5c8;
    --sky1: #0b1124; --sky2: #1b2647; --sun: #ecdcab; --sun-d: #cdb985; --hill: #26365f; --sea: #0d1428; --wave: #3a4f80;
    --accent: #e2733f; --accent-d: #f09060; --on-accent: #141b30; --muted: #a49eae; --hdr: #f0e5c8; --bowl: #34497c;
    --stars: inline; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #141b30; --paper2: #1c2541; --pale: #212b4a; --line: #e6d8b4; --text: #e6dcc4; --head: #f0e5c8;
  --sky1: #0b1124; --sky2: #1b2647; --sun: #ecdcab; --sun-d: #cdb985; --hill: #26365f; --sea: #0d1428; --wave: #3a4f80;
  --accent: #e2733f; --accent-d: #f09060; --on-accent: #141b30; --muted: #a49eae; --hdr: #f0e5c8; --bowl: #34497c;
  --stars: inline; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--paper); }
body { margin: 0; color: var(--text); font-family: var(--sans); font-size: 16px; line-height: 1.5; position: relative; overflow-x: hidden; min-height: 100vh;
  background-color: var(--paper);
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9 .12' numOctaves='3' seed='4'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .33  0 0 0 0 .15  0 0 0 .2 0'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>");
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)); }
body::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 160px; background: linear-gradient(var(--sky1) 0, var(--sky2) 40%, transparent 100%); opacity: .92; z-index: 0; pointer-events: none; }
.wrap { position: relative; z-index: 1; max-width: 440px; margin: 0 auto; }
header.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding-top: 18px; }
h1 { font-family: var(--serif); font-weight: 800; font-size: 34px; letter-spacing: .01em; color: var(--hdr); line-height: 1; margin: 0; text-shadow: 2px 2px 0 #1b2a4e; }
.meta { margin: 9px 0 0; font-size: 15px; font-weight: 500; color: var(--hdr); line-height: 1.5; letter-spacing: .03em; font-variant-numeric: tabular-nums; }
.meta b { font-weight: 700; }
.seal { width: 46px; height: 46px; flex: none; background: var(--accent); color: var(--on-accent); font-family: var(--serif); font-weight: 800; font-size: 15px; line-height: 1.05;
  display: grid; place-items: center; text-align: center; border: 2px solid var(--accent-d); outline: 1.5px solid var(--on-accent); outline-offset: -5px; transform: rotate(3deg); }

.card { margin-top: 26px; background: var(--pale); border: 2.5px solid var(--line); padding: 18px 18px 20px; box-shadow: 4px 4px 0 var(--line); }
.card p { margin: 0; }
.card p + p { margin-top: 10px; }
.card h2 { font-family: var(--serif); font-weight: 800; font-size: 22px; color: var(--head); margin: 0 0 10px; }

/* cartouche: what is on the left pan */
.cart-wrap { margin-top: 22px; filter: drop-shadow(3px 3px 0 var(--line)); }
.cartouche { position: relative; background: var(--pale); border: 2.5px solid var(--line); padding: 9px 14px 10px 12px; display: flex; align-items: center; gap: 12px;
  clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
  box-shadow: inset 0 0 0 3px var(--pale), inset 0 0 0 4.5px var(--accent); }
.cartouche .ico { flex: none; width: 46px; height: 46px; display: grid; place-items: center; font-size: 32px; line-height: 1; }
.cartouche .txt { flex: 1; min-width: 0; }
.cartouche small { display: block; font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--accent-d); }
.cartouche strong { display: block; font-family: var(--serif); font-weight: 800; font-size: 25px; color: var(--head); line-height: 1.12; text-wrap: balance; }
.cartouche .rno { flex: none; align-self: flex-start; font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .04em; white-space: nowrap; padding-top: 2px; }

svg#scale { display: block; width: 100%; height: auto; margin: 6px 0 2px; }
svg.dicon { display: inline-block; vertical-align: middle; }
.stars { display: var(--stars); }

.reading { margin: 0 0 4px; min-height: 1.5em; font-family: var(--serif); font-weight: 700; font-size: 19px; color: var(--head); }
.reading b { color: var(--accent-d); font-variant-numeric: tabular-nums; }

.entry { display: flex; margin-top: 4px; }
.entry input { flex: 1; min-width: 0; font: 500 16px var(--sans); color: var(--text); background: var(--pale); border: 2px solid var(--line); border-right: none; padding: 12px; border-radius: 0; }
.entry input::placeholder { color: var(--muted); opacity: 1; }
.entry input:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--accent); }
.btn { appearance: none; font: 700 15px/1 var(--sans); letter-spacing: .06em; color: var(--head); background: var(--paper2); border: 2px solid var(--line); padding: 0 18px; min-height: 48px; cursor: pointer; }
.btn:disabled { opacity: .45; cursor: default; }
.btn:focus-visible, .primary:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.msg { min-height: 1.4em; margin: 6px 0 0; font-size: 14px; font-weight: 500; color: var(--accent-d); }
.msg button { appearance: none; border: 0; background: none; color: var(--head); text-decoration: underline; font: inherit; font-weight: 700; cursor: pointer; padding: 0 2px; }

.sec { font-family: var(--serif); font-weight: 700; font-size: 14px; color: var(--head); margin: 14px 0 10px; display: flex; align-items: center; gap: 10px; letter-spacing: .04em; }
.sec::after { content: ""; flex: 1; border-top: 2px solid var(--line); border-bottom: 1px solid var(--line); height: 2px; }

.slots { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.slots li { position: relative; background: var(--pale); border: 2px solid var(--line); outline: 1px solid var(--line); outline-offset: 3px; padding: 12px 6px 9px; min-height: 124px; display: flex; flex-direction: column; align-items: center; }
.slots .num { position: absolute; top: 4px; left: 6px; font-family: var(--serif); font-weight: 800; font-size: 13px; color: var(--accent-d); }
.slots .token { width: 60px; height: 60px; border-radius: 50%; margin: 8px 0 7px; display: grid; place-items: center; font-size: 31px; line-height: 1;
  background: radial-gradient(circle, var(--paper) 0 62%, var(--accent) 63% 72%, var(--paper) 73% 78%, var(--line) 79%); }
.slots .name { font-weight: 700; font-size: 13.5px; line-height: 1.2; color: var(--head); text-align: center; letter-spacing: .02em; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.slots .kg { font-size: 12px; color: var(--muted); text-align: center; margin-top: 2px; font-variant-numeric: tabular-nums; }
.slots .x { position: absolute; top: -10px; right: -10px; width: 26px; height: 26px; border-radius: 50%; background: var(--line); color: var(--pale); border: 2px solid var(--pale);
  font: 700 15px/1 var(--sans); display: grid; place-items: center; cursor: pointer; padding: 0 0 2px; appearance: none; }
.slots .x:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.slots li.empty { background: transparent; border-style: dashed; border-color: var(--muted); outline: none; }
.slots li.empty .token { background: none; border: 2px dashed var(--muted); color: var(--muted); font-family: var(--serif); font-size: 22px; }
.slots li.empty .name { color: var(--muted); font-weight: 500; }
.slots li.empty .num { color: var(--muted); }

.primary { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-top: 22px; font-family: var(--serif); font-weight: 800; font-size: 23px; letter-spacing: .06em;
  color: var(--on-accent); background: var(--accent); border: 2.5px solid var(--line); padding: 13px 18px; text-align: left; cursor: pointer; box-shadow: 5px 5px 0 var(--line); appearance: none; }
.primary i { font-style: normal; font-family: var(--sans); font-size: 12.5px; font-weight: 700; letter-spacing: .14em; opacity: .92; }
.primary:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: 2px 2px 0 var(--line); }
.primary:disabled { opacity: .5; cursor: default; box-shadow: 3px 3px 0 var(--line); }
.facts { margin: 14px 0 0; font-size: 15px; line-height: 1.55; background: var(--pale); border-left: 4px solid var(--accent); padding: 10px 12px; }
.used { margin: 22px 0 0; font-size: 13px; color: var(--text); line-height: 1.6; border-top: 1px solid var(--line); padding-top: 10px; }
.used b { font-family: var(--serif); font-weight: 700; color: var(--head); margin-right: 4px; }
.used span { display: inline-block; margin-right: 8px; white-space: nowrap; }

/* weigh ticket */
.ticket table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14.5px; }
.ticket td { padding: 8px 0; border-bottom: 1px dashed var(--muted); vertical-align: top; }
.ticket td.n { text-align: right; white-space: nowrap; padding-left: 10px; font-family: var(--serif); font-weight: 800; font-size: 17px; color: var(--head); }
.ticket .sm { font-size: 13px; color: var(--muted); }
.ticket tr.total td { border-bottom: 0; padding-top: 12px; font-family: var(--serif); font-size: 19px; font-weight: 800; color: var(--head); }
.ticket .sub { font-size: 13px; color: var(--muted); margin: -6px 0 10px; }
.ticket pre { margin: 14px 0 0; font: 500 14px/1.5 var(--sans); white-space: pre-wrap; overflow-wrap: anywhere; user-select: all; background: var(--paper); border: 1.5px dashed var(--line); padding: 10px 12px; color: var(--text); }
.stampbig { float: right; margin: -4px 0 6px 10px; width: 64px; height: 64px; background: var(--accent); color: var(--on-accent); font-family: var(--serif); font-weight: 800;
  display: grid; place-items: center; text-align: center; line-height: 1; border: 2px solid var(--accent-d); outline: 1.5px solid var(--on-accent); outline-offset: -6px; transform: rotate(-4deg); }
.stampbig b { display: block; font-size: 24px; } .stampbig small { font-size: 10px; letter-spacing: .1em; }
.btn.wide { display: block; width: 100%; margin-top: 12px; min-height: 50px; font-size: 16px; }
.linkbtn { appearance: none; background: none; border: 0; color: var(--head); font: 700 14px var(--sans); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 10px 0 0; }
.modechip { display: inline-block; background: var(--accent); color: var(--on-accent); font-size: 10.5px; font-weight: 700; letter-spacing: .12em; padding: 1px 6px; margin-right: 6px; vertical-align: 1px; }
/* result after weighing */
.verdict { margin: 4px -4px 0; padding: 12px 16px 13px; border: 3px solid var(--line); box-shadow: 5px 5px 0 var(--line); transform: rotate(-1.2deg);
  font-family: var(--serif); font-weight: 800; font-size: 34px; line-height: 1.05; letter-spacing: .01em; text-align: center; }
.verdict small { display: block; font-family: var(--sans); font-size: 13px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; margin-bottom: 4px; opacity: .9; }
.verdict.level { background: var(--gold, #f2c84b); color: #1b2a4e; }
.verdict.light { background: #4d6a9c; color: #fbf3df; }
.verdict.heavy { background: var(--accent); color: var(--on-accent); }
.scorerow { display: flex; align-items: stretch; gap: 12px; margin-top: 18px; }
.pts { flex: 1; background: var(--pale); border: 2.5px solid var(--line); display: flex; align-items: baseline; justify-content: center; gap: 8px; padding: 6px 10px 8px; }
.pts b { font-family: var(--serif); font-weight: 800; font-size: 58px; line-height: 1; color: var(--head); font-variant-numeric: tabular-nums; }
.pts span { font-size: 16px; font-weight: 700; color: var(--head); }
.bonus { flex: none; width: 112px; background: #f2c84b; color: #1b2a4e; border: 2.5px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; transform: rotate(2.5deg); box-shadow: 3px 3px 0 var(--line); padding: 4px; }
.bonus b { font-family: var(--serif); font-weight: 800; font-size: 34px; line-height: 1; }
.bonus span { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
.bonus.zero { background: var(--pale); color: var(--muted); transform: none; box-shadow: none; }
.compare { margin-top: 18px; display: grid; gap: 12px; }
.cmp .top { display: flex; align-items: center; gap: 8px; }
.cmp .pics { display: flex; gap: 2px; align-items: center; font-size: 28px; line-height: 1; }
.cmp .who { font-weight: 700; font-size: 16px; color: var(--head); }
.cmp .kg { margin-left: auto; font-family: var(--serif); font-weight: 800; font-size: 26px; color: var(--head); font-variant-numeric: tabular-nums; }
.cmp .lb { font-size: 14px; font-weight: 500; color: var(--muted); margin-left: 6px; }
.cmp .track { margin-top: 5px; height: 16px; background: var(--paper2); border: 2px solid var(--line); }
.cmp .track i { display: block; height: 100%; background: var(--line); transition: width .7s cubic-bezier(.2,.8,.2,1); }
.cmp.mine .track i { background: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
.chip { display: inline-flex; align-items: center; gap: 5px; background: var(--pale); border: 1.5px solid var(--line); padding: 3px 9px 3px 5px; font-size: 15px; font-weight: 500; }
.chip b { font-weight: 700; color: var(--head); }
.chip em { font-style: normal; font-weight: 700; background: #f2c84b; color: #1b2a4e; padding: 0 5px; margin-left: 2px; }
.fact { margin: 16px 0 0; font-size: 16px; line-height: 1.45; }
/* ticket */
.tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin-top: 6px; }
.tile { background: var(--paper); border: 2px solid var(--line); display: flex; flex-direction: column; align-items: center; padding: 6px 2px 0; overflow: hidden; }
.tile .tp { height: 40px; display: grid; place-items: center; font-size: 30px; line-height: 1; }
.tile b { font-family: var(--serif); font-weight: 800; font-size: 26px; color: var(--head); line-height: 1.1; margin-top: 2px; }
.tile em { font-style: normal; font-size: 12.5px; font-weight: 700; background: #f2c84b; color: #1b2a4e; padding: 0 4px; margin-top: 1px; min-height: 17px; }
.tile em.no { background: none; }
.tile s { text-decoration: none; display: block; align-self: stretch; text-align: center; margin-top: 6px; padding: 3px 0; font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.tile.level s { background: #f2c84b; color: #1b2a4e; } .tile.light s { background: #4d6a9c; color: #fbf3df; } .tile.heavy s { background: var(--accent); color: var(--on-accent); }
.total { margin: 18px 0 4px; display: flex; align-items: center; gap: 14px; }
.total .big { background: var(--accent); color: var(--on-accent); border: 2.5px solid var(--line); box-shadow: 4px 4px 0 var(--line); padding: 6px 16px 8px; transform: rotate(-2deg); text-align: center; }
.total .big b { display: block; font-family: var(--serif); font-weight: 800; font-size: 50px; line-height: 1; }
.total .big span { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
.total .side { font-size: 16px; line-height: 1.5; }
.total .side b { font-family: var(--serif); font-size: 20px; color: var(--head); }
.toast { position: fixed; left: 16px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--line); color: var(--pale); padding: 10px 14px; font-size: 14px; z-index: 20; }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Counterweight</h1>
      <p class="meta" id="meta"></p>
    </div>
    <div class="seal" aria-hidden="true">秤<br>量</div>
  </header>

  <section class="card" id="intro">
    <h2>Five weights a day</h2>
    <p style="font-size:17px">Type up to three things to balance the mystery weight. Get close to score. <b>Unusual picks earn an ingenuity bonus.</b></p>
    <button class="primary" id="startBtn" type="button">Begin the weigh-in <i>→</i></button>
    <button class="btn wide" id="endlessBtn" type="button">Play unlimited</button>
  </section>

  <section id="play" hidden>
    <div class="cart-wrap"><div class="cartouche">
      <span class="ico" id="loadIcon" aria-hidden="true"></span>
      <span class="txt"><small>On the left pan</small><strong id="loadName"></strong></span>
    </div></div>
    <svg id="scale" viewBox="0 0 360 290" role="img" aria-label="A balance scale"></svg>
    <p class="reading" id="reading" aria-live="polite"></p>
    <form id="adder" autocomplete="off">
      <div class="entry"><input id="thing" type="text" maxlength="40" placeholder="a watermelon, a cat, a brick..." aria-label="Add an object to the right pan" enterkeyhint="done"><button class="btn" id="addBtn" type="submit">Add</button></div>
      <p class="msg" id="msg"></p>
    </form>
    <div id="before">
      <h2 class="sec">On the right pan</h2>
      <ul class="slots" id="tokens"></ul>
      <button class="primary" id="weighBtn" type="button" disabled>Weigh it <i id="hint">0 OF 3</i></button>
    </div>
    <div id="after" hidden>
      <div class="verdict" id="verdict"></div>
      <div class="scorerow"><div class="pts"><b id="ptsN">0</b><span>points</span></div><div class="bonus" id="bonus"><b id="bonusN"></b><span>ingenuity</span></div></div>
      <div class="compare" id="compare"></div>
      <p class="fact" id="facts"></p>
      <button class="primary" id="nextBtn" type="button">Next round <i>→</i></button>
    </div>
    <p class="used" id="used"></p>
    <button class="linkbtn" id="exitEndless" type="button" hidden>Back to today's weigh-in</button>
  </section>

  <section class="card ticket" id="summary" hidden>
    <h2 id="tHead">Weigh ticket</h2>
    <div class="tiles" id="tiles"></div>
    <div class="total" id="total"></div>
    <pre id="shareText" hidden></pre>
    <button class="primary" id="shareBtn" type="button">Copy result <i>→</i></button>
    <button class="btn wide" id="endlessBtn2" type="button">Keep playing: unlimited mode</button>
  </section>
</div>
<div class="toast" id="toast" hidden></div>

    if (!near.length) { es.seen = {}; near = POOL; }
    var e = near[Math.floor(Math.random() * near.length)]; es.seen[e.id] = 1;
    return { load: [e.icon, withArticle(e.name), e.kg, ''] };
  }
  function startEndless() {
    mode = 'endless'; es = { n: 0, sum: 0, run: 0, seen: {}, fat: {} };
    day = [endlessLoad()]; idx = 0; show('play'); $('exitEndless').hidden = false; track('endless');
    try { history.replaceState(null, '', '#unlimited'); } catch (e) {}
    renderRound();
  }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function show(id) { ['intro', 'play', 'summary'].forEach(function (s) { $(s).hidden = s !== id; }); }
  function usedList() { var u = {}; if (mode === 'endless') { pan.forEach(function (e) { u[e.id] = e; }); return u; } ds.a.forEach(function (r) { (r || []).forEach(function (e) { u[e.id] = e; }); }); pan.forEach(function (e) { u[e.id] = e; }); return u; }

  // ---- the scale ----
  function roundel(ic, x, y, r) {
    var s = '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="var(--pale)" stroke="var(--line)" stroke-width="2.5"/>' +
      '<circle cx="' + x + '" cy="' + y + '" r="' + (r * 0.79).toFixed(1) + '" fill="none" stroke="var(--accent)" stroke-width="1.6"/>';
    if (drawn(ic)) { var w = r * 1.5; s += '<svg x="' + (x - w / 2) + '" y="' + (y - w / 2) + '" width="' + w + '" height="' + w + '" viewBox="0 0 64 64">' + CW_ICONS[ic.slice(1)] + '</svg>'; }
    else s += '<text x="' + x + '" y="' + (y + r * 0.04) + '" font-size="' + (r * 1.15).toFixed(1) + '" text-anchor="middle" dominant-baseline="central" ' + EMO + '>' + ic + '</text>';
    return s;
  }
  function panGroup(x, y, inner) {
    var R = y + 124;
    return '<g stroke="var(--line)" fill="none" stroke-linecap="round"><path d="M' + x + ' ' + (y + 4) + ' L' + (x - 30) + ' ' + R + 'M' + x + ' ' + (y + 4) + ' L' + (x + 30) + ' ' + R + '" stroke-width="2"/>' +
      '<path d="M' + x + ' ' + (y + 4) + ' V' + (R + 4) + '" stroke-width="1"/></g>' + inner +
      '<path d="M' + (x - 40) + ' ' + R + ' H' + (x + 40) + ' Q' + (x + 38) + ' ' + (R + 28) + ' ' + x + ' ' + (R + 28) + ' Q' + (x - 36) + ' ' + (R + 28) + ' ' + (x - 40) + ' ' + R + 'Z" fill="var(--bowl)" stroke="var(--line)" stroke-width="2.5" stroke-linejoin="round"/>' +
      '<path d="M' + (x - 40) + ' ' + R + ' H' + (x + 40) + '" stroke="var(--line)" stroke-width="4" stroke-linecap="round"/>' +
      '<path d="M' + (x - 28) + ' ' + (R + 10) + ' Q' + x + ' ' + (R + 18) + ' ' + (x + 28) + ' ' + (R + 10) + '" fill="none" stroke="var(--accent)" stroke-width="2"/>';
  }
  function loadOnPan(ic, x, R) {
    if (drawn(ic)) { var w = 82; return '<svg x="' + (x - w / 2) + '" y="' + (R - w * 0.9) + '" width="' + w + '" height="' + w + '" viewBox="0 0 64 64">' + CW_ICONS[ic.slice(1)] + '</svg>'; }
    return '<ellipse cx="' + x + '" cy="' + R + '" rx="30" ry="4" fill="var(--line)" opacity=".3"/>' + roundel(ic, x, R - 30, 29);
  }
  function itemsOnPan(x, R) {
    if (!pan.length) return '<text x="' + x + '" y="' + (R - 10) + '" font-size="12" text-anchor="middle" fill="var(--hdr)" font-family="Zen Kaku Gothic New, sans-serif" font-weight="700" letter-spacing="1">EMPTY</text>';
    var h = '<ellipse cx="' + x + '" cy="' + R + '" rx="36" ry="4" fill="var(--line)" opacity=".3"/>';
    // a drawn picture stands on the pan; an emoji sits on a round token
    function put(ic, cx, base, r) {
      if (drawn(ic)) { var w = r * 2.5; return '<svg x="' + (cx - w / 2) + '" y="' + (base - w * 0.93) + '" width="' + w + '" height="' + w + '" viewBox="0 0 64 64">' + CW_ICONS[ic.slice(1)] + '</svg>'; }
      return roundel(ic, cx, base - r - 1, r);
    }
    if (pan.length === 1) return h + put(pan[0].icon, x, R, 25);
    if (pan.length === 2) return h + put(pan[0].icon, x - 19, R, 20) + put(pan[1].icon, x + 19, R, 20);
    return h + put(pan[2].icon, x, R - 32, 16) + put(pan[0].icon, x - 20, R, 17) + put(pan[1].icon, x + 20, R, 17);
  }
  function seal(res) {
    var t = res.level ? 'LEVEL' : (res.off < 0 ? 'LIGHT' : 'HEAVY');
    return '<g transform="translate(296 18) rotate(5)"><rect width="54" height="54" fill="var(--accent)" stroke="var(--accent-d)" stroke-width="2"/>' +
      '<rect x="5" y="5" width="44" height="44" fill="none" stroke="var(--on-accent)" stroke-width="1.3"/>' +
      '<text x="27" y="30" text-anchor="middle" font-size="20" font-weight="800" fill="var(--on-accent)" font-family="Shippori Mincho, Georgia, serif">' + res.points + '</text>' +
      '<text x="27" y="42" text-anchor="middle" font-size="8" font-weight="700" letter-spacing="1" fill="var(--on-accent)" font-family="Zen Kaku Gothic New, sans-serif">' + t + '</text></g>';
  }
  function scaleSVG(angle, res) {
    var r = day[idx], a = angle || 0, cx = 180, cy = 62, L = 136;
    var rad = a * Math.PI / 180, dx = Math.cos(rad) * L, dy = Math.sin(rad) * L;
    var lx = cx - dx, ly = cy - dy, rx = cx + dx, ry = cy + dy;
    var h = '';
    // night sky
    h += '<g class="stars" fill="var(--sun)">';
    [[24, 22, 1.6], [70, 40, 1.1], [118, 14, 1.4], [252, 30, 1.2], [300, 88, 1.5], [338, 20, 1.1], [92, 96, 1], [270, 120, 1.1]].forEach(function (s) { h += '<circle cx="' + s[0] + '" cy="' + s[1] + '" r="' + s[2] + '"/>'; });
    h += '</g>';
    h += '<circle cx="180" cy="112" r="92" fill="var(--sun)" stroke="var(--sun-d)" stroke-width="2"/>';
    h += '<path d="M0 214 Q50 170 104 204 T210 196 T360 188 V290 H0Z" fill="var(--hill)"/>';
    h += '<path d="M0 214 Q50 170 104 204 T210 196 T360 188" fill="none" stroke="var(--sea)" stroke-width="2.5"/>';
    h += '<path d="M0 238 Q70 214 140 236 T360 226 V290 H0Z" fill="var(--sea)"/>';
    h += '<g stroke="var(--wave)" stroke-width="1.2" opacity=".85"><path d="M20 250H80M110 258H200M240 246H330M60 270H160M210 274H300"/></g>';
    // stand
    h += '<g stroke="var(--line)" stroke-width="2.5" stroke-linejoin="round"><path d="M138 276 L146 262 H214 L222 276Z" fill="var(--paper)"/><path d="M152 262 L158 248 H202 L208 262Z" fill="var(--pale)"/><path d="M172 248 V70 H188 V248Z" fill="var(--pale)"/></g>';
    h += '<path d="M177 244 V76" stroke="var(--accent)" stroke-width="3"/><path d="M153 256H207M142 270H218" stroke="var(--line)" stroke-width="1" opacity=".6"/>';
    // fixed level notch
    h += '<path d="M180 22 V30" stroke="var(--hdr)" stroke-width="2" stroke-linecap="round" opacity=".8"/>';
    // beam (rotates)
    h += '<g transform="rotate(' + a.toFixed(2) + ' 180 62)">' +
      '<path d="M180 49 L174 49 L180 34 L186 49Z" fill="var(--line)"/>' +
      '<path d="M34 62 Q40 53 52 55 L180 58 L308 55 Q320 53 326 62 Q320 71 308 69 L180 66 L52 69 Q40 71 34 62Z" fill="var(--pale)" stroke="var(--line)" stroke-width="2.5" stroke-linejoin="round"/>' +
      '<path d="M60 62 H160M200 62H300" stroke="var(--line)" stroke-width="1" opacity=".6"/>' +
      '<circle cx="44" cy="62" r="4" fill="var(--accent)" stroke="var(--line)" stroke-width="1.8"/><circle cx="316" cy="62" r="4" fill="var(--accent)" stroke="var(--line)" stroke-width="1.8"/></g>';
    h += '<circle cx="180" cy="62" r="13" fill="var(--accent)" stroke="var(--line)" stroke-width="2.5"/><circle cx="180" cy="62" r="5" fill="var(--pale)" stroke="var(--line)" stroke-width="1.8"/>';
    // pans hang straight down from the beam ends
    h += panGroup(lx, ly, loadOnPan(r.load[0], lx, ly + 124));
    h += panGroup(rx, ry, itemsOnPan(rx, ry + 124));
    if (res) h += seal(res);
    return h;
  }
  function drawScale(angle, res) { $('scale').innerHTML = scaleSVG(angle, res); }
  function tiltFor(res) { if (!res.mass) return -13; return Math.max(-13, Math.min(13, Math.log(res.ratio) * 28)); }

  function renderRound() {
    var r = day[idx]; pan = []; weighed = false; lastRes = null;
    $('loadIcon').innerHTML = iconHTML(r.load[0], 46);
    $('loadName').textContent = r.load[1];
    if (mode === 'endless') renderRoundMeta();
    else setMeta('Round ' + (idx + 1) + ' of ' + day.length);
    $('scale').setAttribute('aria-label', 'A balance scale. The left pan holds ' + r.load[1].toLowerCase() + '.');
    $('reading').textContent = ''; $('msg').textContent = ''; $('thing').value = '';
    $('adder').hidden = false; $('before').hidden = false; $('used').hidden = false; $('after').hidden = true; $('reading').hidden = true;
    renderTokens(); drawScale(0);
    window.scrollTo(0, 0);
  }
  function renderTokens() {
    var h = '';
    for (var i = 0; i < 3; i++) {
      var e = pan[i];
      if (!e) { h += '<li class="empty"><span class="num">' + NUMS[i] + '</span><div class="token" aria-hidden="true">+</div><div class="name">' + (weighed ? '—' : 'Empty') + '</div></li>'; continue; }
      h += '<li><span class="num">' + NUMS[i] + '</span>' + (weighed ? '' : '<button type="button" class="x" data-k="' + i + '" aria-label="Take ' + esc(e.name) + ' off">×</button>') +
        '<div class="token" aria-hidden="true">' + iconHTML(e.icon, drawn(e.icon) ? 44 : 36) + '</div><div class="name">' + esc(cap(e.name)) + '</div>' +
        (weighed ? '<div class="kg">' + CW.fmt(e.kg).replace(/ \(.*\)$/, '') + '</div>' : '') + '</li>';
    }
    $('tokens').innerHTML = h;
    Array.prototype.forEach.call($('tokens').querySelectorAll('.x'), function (b) { b.addEventListener('click', function () { pan.splice(+b.getAttribute('data-k'), 1); renderTokens(); drawScale(0); }); });
    $('weighBtn').disabled = !pan.length || weighed;
    $('addBtn').disabled = weighed || pan.length >= CW.MAX_PICK;
    $('hint').textContent = pan.length + ' OF 3 PLACED';
    var u = usedList(), prev = Object.keys(u).filter(function (id) { return weighed || !pan.some(function (e) { return e.id === id; }); });
    if (mode === 'endless' || !prev.length) { $('used').innerHTML = ''; $('used').style.display = 'none'; return; }
    $('used').style.display = '';
    $('used').innerHTML = '<b>Used today:</b> ' + prev.map(function (id) { return '<span>' + iconHTML(u[id].icon, 18) + ' ' + esc(u[id].name) + '</span>'; }).join('');
  }
  function isTheLoad(e) {
    var L = day[idx].load, words = L[1].toLowerCase().replace(/[^a-z0-9 ]/g, ' ').split(/\s+/).filter(function (w) { return w.length > 2; });
    var shares = e.name.toLowerCase().split(/[^a-z0-9]+/).some(function (w) { return w.length > 2 && words.indexOf(w) >= 0; });
    return shares && Math.abs(Math.log(e.kg / L[2])) < 0.05;
  }
  function add(text) {
    if (weighed) return;
    if (pan.length >= CW.MAX_PICK) { $('msg').textContent = 'The pan holds three objects.'; return; }
    var r = CW.lookup(text);
    if (!r.entry) {
      $('msg').innerHTML = esc(r.error) + (r.suggestions && r.suggestions.length ? ' Did you mean ' + r.suggestions.map(function (s) { return '<button type="button" data-s="' + esc(s) + '">' + esc(s) + '</button>'; }).join(', ') + '?' : (r.suggestions ? ' Try something more everyday.' : ''));
      Array.prototype.forEach.call($('msg').querySelectorAll('button'), function (b) { b.addEventListener('click', function () { add(b.getAttribute('data-s')); }); });
      return;
    }
    var e = { id: r.entry.id, name: r.entry.name, kg: r.entry.kg, icon: r.entry.icon };
    if (mode === 'endless' && usedList()[e.id]) { $('msg').textContent = 'The ' + e.name + ' is already on the pan.'; return; }
    if (usedList()[e.id]) { $('msg').textContent = 'You\'ve already used the ' + e.name + ' today. Try something else.'; return; }
    if (isTheLoad(e)) { $('msg').textContent = 'That\'s what\'s on the other pan. Nice try.'; return; }
    pan.push(e); $('thing').value = ''; $('msg').textContent = r.corrected ? 'Read that as "' + e.name + '".' : '';
    renderTokens(); drawScale(0);
  }
  $('adder').addEventListener('submit', function (ev) { ev.preventDefault(); add($('thing').value); if (pan.length < 3) $('thing').focus(); });
  $('weighBtn').addEventListener('click', function () {
    if (!pan.length || weighed) return;
    weighed = true;
    if (mode === 'daily') {
      if (idx === 0 && !ds.a.length) track('start');
      ds.a[idx] = pan.slice(); save();
    }
    $('adder').hidden = true; renderTokens();
    var r = day[idx], res = CW.score(r, pan), target = tiltFor(res);
    var ing = CW.ingenuity(r, pan, mode === 'endless' ? es.fat : fatigue());
    res.ing = ing; lastRes = res;
    if (mode === 'daily') { ds.b = ds.b || []; ds.b[idx] = ing.bonus; save(); }
    if (mode === 'endless') {
      pan.forEach(function (e) { es.fat[e.id] = (es.fat[e.id] || 0) + 2; });
      es.n++; es.sum += res.points + ing.bonus; es.run = res.points >= 80 ? es.run + 1 : 0;
      var E = store.endless; E.n++; E.sum += res.points + ing.bonus; if (res.level) E.levels++; if (es.run > E.best) E.best = es.run; save();
    }
    var t0 = performance.now(), dur = reduce ? 0 : 1500;
    (function swing() {
      var t = dur ? Math.min(1, (performance.now() - t0) / dur) : 1;
      drawScale(t >= 1 ? target : target * (1 - Math.exp(-4.5 * t) * Math.cos(9 * t)), null);
      if (t < 1) requestAnimationFrame(swing); else afterWeigh(r, res);
    })();
  });
  function verdictOf(res) {
    if (res.level) return { cls: 'level', top: 'Perfect balance', big: 'Dead level!' };
    var heavy = res.off > 0, k = heavy ? 'heavy' : 'light', p = Math.abs(res.off);
    var big = heavy && res.ratio >= 2 ? (res.ratio >= 10 ? Math.round(res.ratio) : res.ratio.toFixed(1)) + '× too heavy' : !heavy && res.ratio <= 0.5 ? (1 / res.ratio >= 10 ? Math.round(1 / res.ratio) : (1 / res.ratio).toFixed(1)) + '× too light' : Math.round(p * 100) + '% too ' + k;
    var top = p <= 0.05 ? 'So close' : p <= 0.15 ? 'Nearly' : p <= 0.4 ? 'Not bad' : 'Way off';
    return { cls: k, top: top, big: big };
  }
  function kgBig(kg) { var f = CW.fmt(kg), m = f.match(/^(.*?) \((.*)\)$/); return m ? '<span>' + m[1] + '</span><span class="lb">' + m[2] + '</span>' : f; }
  function countUp(el, n) {
    if (reduce || !n) { el.textContent = n; return; }
    var t0 = performance.now(); (function f() { var t = Math.min(1, (performance.now() - t0) / 650); el.textContent = Math.round(n * (1 - Math.pow(1 - t, 3))); if (t < 1) requestAnimationFrame(f); })();
  }
  function afterWeigh(r, res) {
    var v = verdictOf(res), ing = res.ing || { bonus: 0, per: [] };
    $('verdict').className = 'verdict ' + v.cls;
    $('verdict').innerHTML = '<small>' + v.top + '</small>' + v.big;
    countUp($('ptsN'), res.points);
    $('bonus').className = 'bonus' + (ing.bonus ? '' : ' zero');
    $('bonusN').textContent = '+' + ing.bonus;
    var max = Math.max(r.load[2], res.mass);
    var w = function (kg) { return Math.max(3, Math.round(100 * kg / max)) + '%'; };
    $('compare').innerHTML =
      '<div class="cmp"><div class="top"><span class="pics">' + iconHTML(r.load[0], 34) + '</span><span class="who">Mystery</span><span class="kg">' + kgBig(r.load[2]) + '</span></div><div class="track"><i style="width:0"></i></div></div>' +
      '<div class="cmp mine"><div class="top"><span class="pics">' + pan.map(function (e) { return iconHTML(e.icon, 30); }).join('') + '</span><span class="who">Yours</span><span class="kg">' + kgBig(res.mass) + '</span></div><div class="track"><i style="width:0"></i></div></div>' +
      '<div class="chips">' + pan.map(function (e, i) { var b = ing.per[i] && ing.per[i].pts; return '<span class="chip">' + iconHTML(e.icon, 22) + '<b>' + esc(cap(e.name)) + '</b> ' + CW.fmt(e.kg).replace(/ \(.*\)$/, '') + (b ? '<em>+' + b + '</em>' : '') + '</span>'; }).join('') + (ing.mix ? '<span class="chip"><b>Mixed kinds</b><em>+' + ing.mix + '</em></span>' : '') + '</div>';
    var bars = $('compare').querySelectorAll('.track i');
    requestAnimationFrame(function () { requestAnimationFrame(function () { bars[0].style.width = w(r.load[2]); bars[1].style.width = w(res.mass); }); });
    $('facts').textContent = r.load[3] ? r.load[3] + '.' : '';
    $('before').hidden = true; $('used').hidden = true; $('after').hidden = false;
    $('nextBtn').innerHTML = (mode === 'endless' ? 'Next weight' : idx < day.length - 1 ? 'Next round' : 'See your ticket') + ' <i>→</i>';
    if (mode === 'endless') renderRoundMeta();
    $('scale').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
  }
  // personal fatigue: how many earlier days each object was used (shrinks its ingenuity bonus)
  function fatigue() {
    var f = {};
    Object.keys(store.days).forEach(function (k) { if (k === today) return; var seen = {}; (store.days[k].a || []).forEach(function (r) { (r || []).forEach(function (e) { seen[e.id] = 1; }); }); Object.keys(seen).forEach(function (id) { f[id] = (f[id] || 0) + 1; }); });
    return f;
  }
  function renderRoundMeta() { $('meta').innerHTML = '<span class="modechip">UNLIMITED</span><b>Round ' + (idx + 1) + '</b>' + (es.n ? ' · avg ' + Math.round(es.sum / es.n) : '') + (es.run > 1 ? ' · ' + es.run + ' in a row' : ''); }
  $('nextBtn').addEventListener('click', function () { if (mode === 'endless') { day.push(endlessLoad()); idx++; renderRound(); return; } if (idx < day.length - 1) { idx++; renderRound(); } else finish(); });

  function finish() {
    show('summary'); setMeta('Done for today');
    var fat = fatigue();
    var rows = day.map(function (r, i) { var res = CW.score(r, ds.a[i]); var bonus = ds.b && ds.b[i] != null ? ds.b[i] : CW.ingenuity(r, ds.a[i], fat).bonus; return { r: r, pan: ds.a[i], res: res, bonus: bonus }; });
    var base = rows.reduce(function (s, x) { return s + x.res.points; }, 0), bonus = rows.reduce(function (s, x) { return s + x.bonus; }, 0), total = base + bonus;
    if (!ds.done) { ds.done = 1; ds.total = total; save(); track('finish'); }
    $('tHead').textContent = 'Weigh-in No. ' + no;
    $('tiles').innerHTML = rows.map(function (x) {
      var v = verdictOf(x.res), word = x.res.level ? 'level' : (x.res.off > 0 ? 'heavy' : 'light');
      return '<div class="tile ' + v.cls + '"><div class="tp">' + iconHTML(x.r.load[0], 40) + '</div><b>' + x.res.points + '</b><em class="' + (x.bonus ? '' : 'no') + '">' + (x.bonus ? '+' + x.bonus : '') + '</em><s>' + word + '</s></div>';
    }).join('');
    var done = Object.keys(store.days).filter(function (k) { return store.days[k].done; });
    var streak = 0, d = new Date(); while (store.days[ymdOf(d)] && store.days[ymdOf(d)].done) { streak++; d.setDate(d.getDate() - 1); }
    $('total').innerHTML = '<div class="big"><b>' + total + '</b><span>points</span></div><div class="side">' + (bonus ? '<b>+' + bonus + '</b> ingenuity<br>' : '') + '<b>' + streak + '</b> day streak</div>';
    var line = rows.map(function (x) { var p = Math.abs(x.res.off); return x.res.level ? '🟩' : p <= 0.1 ? '🟨' : p <= 0.3 ? '🟧' : '🟥'; }).join('');
    $('shareText').textContent = 'Counterweight No. ' + no + ' · ' + total + ' pts' + (bonus ? ' (+' + bonus + ' ingenuity)' : '') + '\n' + line + (CONFIG.siteUrl ? '\n' + CONFIG.siteUrl : '');
    window.scrollTo(0, 0);
  }
  $('shareBtn').addEventListener('click', function () {
    var t = $('shareText').textContent; track('share');
    var fb = function () { $('shareText').hidden = false; var r = document.createRange(); r.selectNodeContents($('shareText')); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); toast('Selected. Copy it to share.'); };
    try { navigator.clipboard.writeText(t).then(function () { toast('Copied'); }, fb); } catch (e) { fb(); }
  });
  var tt = 0; function toast(m) { var t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(function () { t.hidden = true; }, 1900); }
  function begin() { if (ds.done || ds.a.length >= day.length) { finish(); return; } show('play'); idx = ds.a.length; renderRound(); }
  $('startBtn').addEventListener('click', begin);
  $('endlessBtn').addEventListener('click', startEndless);
  $('endlessBtn2').addEventListener('click', startEndless);
  $('exitEndless').addEventListener('click', function () { try { history.replaceState(null, '', location.pathname); } catch (e) {} location.reload(); });
  if (/unlimited/.test(location.hash)) startEndless();
  else if (ds.done || ds.a.length) begin();
  document.addEventListener('visibilitychange', function () { if (mode === 'daily' && document.visibilityState === 'visible' && ymdOf(new Date()) !== today) location.reload(); });
})();
</script>
